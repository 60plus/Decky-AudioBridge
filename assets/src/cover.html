<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1600px; height: 1000px; overflow: hidden; position: relative;
    font-family: "Inter", "DejaVu Sans", sans-serif;
    background:
      radial-gradient(900px 700px at 1180px 470px, rgba(37, 99, 235, 0.42), rgba(37, 99, 235, 0) 70%),
      radial-gradient(700px 500px at 180px 120px, rgba(56, 189, 248, 0.16), rgba(56, 189, 248, 0) 70%),
      radial-gradient(1200px 500px at 700px 1050px, rgba(29, 78, 216, 0.35), rgba(29, 78, 216, 0) 70%),
      linear-gradient(160deg, #061331 0%, #040b20 55%, #020611 100%);
  }
  svg.fx { position: absolute; inset: 0; }
  .text { position: absolute; left: 112px; top: 196px; }
  .title { font-weight: 800; font-size: 182px; line-height: 0.95; letter-spacing: -5px; color: #ffffff;
           text-shadow: 0 6px 40px rgba(37, 99, 235, 0.45); }
  .title .accent { background: linear-gradient(90deg, #7dd3fc 0%, #38bdf8 40%, #3b82f6 100%);
                   -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none;
                   filter: drop-shadow(0 6px 30px rgba(56, 189, 248, 0.45)); }
  .subtitle { margin-top: 34px; font-size: 46px; font-weight: 500; color: #c3d3f0; letter-spacing: -0.5px; }
  .chips { margin-top: 56px; display: flex; gap: 22px; }
  .chip { display: flex; align-items: center; gap: 18px; padding: 20px 28px 20px 22px; border-radius: 20px;
          background: rgba(12, 28, 62, 0.72); border: 2px solid rgba(125, 211, 252, 0.28);
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06); }
  .chip svg { width: 52px; height: 52px; flex: none; }
  .chip span { font-size: 27px; font-weight: 600; line-height: 1.2; color: #e8eefc; }
  .tagline { position: absolute; left: 112px; bottom: 74px; display: flex; align-items: center; gap: 26px;
             font-size: 21px; font-weight: 600; letter-spacing: 7px; color: #5f80bd; }
  .tagline::before { content: ""; width: 92px; height: 2px; background: #3a5a99; }
  .icon { position: absolute; left: 948px; top: 222px; width: 480px; height: 480px; }
</style>
</head>
<body>
<svg class="fx" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="bigglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <!-- the lower stream only shows its last stretch, clear of the text -->
    <linearGradient id="streamLow" gradientUnits="userSpaceOnUse" x1="880" y1="0" x2="1010" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- soft light ribbons -->
  <g fill="none" stroke="#2563eb" stroke-width="60" opacity="0.18" filter="url(#bigglow)">
    <path d="M -50 960 C 560 950, 820 700, 1000 560"/>
    <path d="M -50 140 C 380 170, 720 330, 1000 420"/>
  </g>

  <!-- particle streams flowing into the bridge -->
  <g fill="none" stroke="url(#stream)" stroke-linecap="round">
    <path d="M -20 975 C 560 965, 820 720, 1010 560" stroke="url(#streamLow)" stroke-width="7" stroke-dasharray="0 22" filter="url(#glow)"/>
    <path d="M -20 975 C 560 965, 820 720, 1010 560" stroke="url(#streamLow)" stroke-width="5" stroke-dasharray="0 22"/>
    <path d="M -20 120 C 380 150, 720 320, 1000 410" stroke-width="7" stroke-dasharray="0 24" filter="url(#glow)"/>
    <path d="M -20 120 C 380 150, 720 320, 1000 410" stroke-width="5" stroke-dasharray="0 24"/>
    <path d="M -20 70 C 420 100, 760 280, 1010 370" stroke-width="3.5" stroke-dasharray="0 17" opacity="0.6"/>
  </g>

  <!-- sound waves leaving the bridge -->
  <g fill="none" stroke-linecap="round">
    <path d="M 1452 322 A 230 230 0 0 1 1452 602" stroke="#7dd3fc" stroke-width="12" opacity="0.75"/>
    <path d="M 1496 262 A 300 300 0 0 1 1496 662" stroke="#38bdf8" stroke-width="9" opacity="0.45"/>
    <path d="M 1540 200 A 370 370 0 0 1 1540 724" stroke="#3b82f6" stroke-width="7" opacity="0.25"/>
    <path d="M 1452 322 A 230 230 0 0 1 1452 602" stroke="#38bdf8" stroke-width="22" opacity="0.35" filter="url(#glow)"/>
  </g>

  <!-- sparkles -->
  <g fill="#bae6fd">
    <circle cx="905" cy="318" r="5" opacity="0.9"/><circle cx="880" cy="640" r="4" opacity="0.8"/>
    <circle cx="1415" cy="770" r="6" opacity="0.7"/><circle cx="1370" cy="170" r="4" opacity="0.8"/>
    <circle cx="1560" cy="470" r="5" opacity="0.6"/>
  </g>
  <g fill="#7dd3fc" filter="url(#glow)">
    <circle cx="905" cy="318" r="9" opacity="0.6"/><circle cx="1415" cy="770" r="10" opacity="0.5"/>
    <circle cx="1560" cy="470" r="9" opacity="0.5"/>
  </g>
</svg>

<img class="icon" src="icon.svg" alt="">

<div class="text">
  <div class="title">Audio<br><span class="accent">Bridge</span></div>
  <div class="subtitle">Hear your games on another PC</div>
  <div class="chips">
    <div class="chip">
      <svg viewBox="0 0 48 48" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="21" cy="21" r="12"/><path d="M30 30 L41 41"/><path d="M16 21 h10 M21 16 v10" stroke="#38bdf8"/>
      </svg>
      <span>One-button<br>setup</span>
    </div>
    <div class="chip">
      <svg viewBox="0 0 48 48" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M27 4 L10 27 H24 L21 44 L38 20 H24 Z" fill="rgba(56,189,248,0.18)"/>
      </svg>
      <span>Low<br>latency</span>
    </div>
    <div class="chip">
      <svg viewBox="0 0 48 48" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="13" width="40" height="23" rx="11.5"/><path d="M13 21 v7 M9.5 24.5 h7"/>
        <circle cx="33" cy="22" r="1.8" fill="#7dd3fc"/><circle cx="37" cy="27" r="1.8" fill="#7dd3fc"/>
      </svg>
      <span>Stays in<br>Gaming Mode</span>
    </div>
  </div>
</div>

<div class="tagline">STEAMOS TO WINDOWS, OVER YOUR HOME NETWORK</div>
</body>
</html>
