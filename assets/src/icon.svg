<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="85%">
      <stop offset="0" stop-color="#17305f"/>
      <stop offset="0.55" stop-color="#0b1838"/>
      <stop offset="1" stop-color="#050b1c"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- user space units: a vertical line has a zero-width box, so a
         bounding-box gradient would leave the bars unpainted -->
    <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="0" y1="160" x2="0" y2="480">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="0.45" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="tile"><rect x="40" y="40" width="560" height="560" rx="128"/></clipPath>
  </defs>

  <!-- outer glow -->
  <rect x="52" y="60" width="536" height="536" rx="124" fill="#2563eb" opacity="0.55" filter="url(#soft)"/>

  <!-- tile -->
  <rect x="40" y="40" width="560" height="560" rx="128" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <ellipse cx="320" cy="560" rx="300" ry="120" fill="#2563eb" opacity="0.28" filter="url(#soft)"/>
    <rect x="40" y="40" width="560" height="280" fill="url(#shine)"/>
  </g>
  <rect x="44" y="44" width="552" height="552" rx="124" fill="none" stroke="url(#rim)" stroke-width="8" opacity="0.95"/>

  <!-- sound arcs -->
  <g fill="none" stroke="#7dd3fc" stroke-linecap="round" opacity="0.55">
    <path d="M128 228 A 150 150 0 0 0 128 412" stroke-width="16"/>
    <path d="M512 228 A 150 150 0 0 1 512 412" stroke-width="16"/>
  </g>

  <!-- bars, glow then crisp -->
  <g stroke="url(#bar)" stroke-width="44" stroke-linecap="round" filter="url(#glow)" opacity="0.9">
    <line x1="200" y1="282" x2="200" y2="358"/>
    <line x1="260" y1="236" x2="260" y2="404"/>
    <line x1="320" y1="182" x2="320" y2="458"/>
    <line x1="380" y1="236" x2="380" y2="404"/>
    <line x1="440" y1="282" x2="440" y2="358"/>
  </g>
  <g stroke="url(#bar)" stroke-width="40" stroke-linecap="round">
    <line x1="200" y1="282" x2="200" y2="358"/>
    <line x1="260" y1="236" x2="260" y2="404"/>
    <line x1="320" y1="182" x2="320" y2="458"/>
    <line x1="380" y1="236" x2="380" y2="404"/>
    <line x1="440" y1="282" x2="440" y2="358"/>
  </g>
</svg>
